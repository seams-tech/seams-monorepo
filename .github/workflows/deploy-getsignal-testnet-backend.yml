      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Wallet Runtime build entry
        run: test -s .release-artifacts/wallet-runtime/payload/d1WalletRuntimeWorker.js
      - name: Deploy Wallet Runtime
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component wallet-runtime

  deploy_gateway:
    name: Deploy / getsignal-testnet / gateway
    needs: [deploy_router, deploy_wallet_runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
