[project]
name = "voiceid-verifier-spike"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
moonshine = [
  "moonshine-voice==0.0.71",
]
native-export = [
  "numpy==2.2.6",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "speechbrain==1.1.0",
  "moonshine-voice==0.1.5",
  "onnx==1.17.0",
  "onnxruntime==1.23.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
