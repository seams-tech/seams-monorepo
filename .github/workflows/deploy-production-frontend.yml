name: Deploy / production / frontend

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Backend lane to verify after publishing the Wallet site and docs
        required: true
        type: choice
        default: production-mainnet
        options:
          - production-mainnet
          - production-testnet
  workflow_call:
    inputs:
      lane:
        description: Backend lane verified after the complete frontend deployment
        required: true
        type: string
      component:
        description: Frontend surfaces selected by a full-stack caller
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: deployment-production-frontend
  cancel-in-progress: false

env:
  DEPLOY_SITE: production
  DEPLOY_COMPONENT: ${{ inputs.component || 'wallet-site' }}
  DEPLOY_BACKEND_LANE: ${{ inputs.lane }}
  DEPLOY_SHA: ${{ github.sha }}
  RUST_TOOLCHAIN: 1.96.0

jobs:
  deploy:
    name: Deploy / production / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_VITE: ${{ secrets.CF_PAGES_PROJECT_VITE }}
      CF_PAGES_PROJECT_PLATFORM_CONSOLE: ${{ secrets.CF_PAGES_PROJECT_PLATFORM_CONSOLE }}
      CF_PAGES_PROJECT_WALLET_CONSOLE: ${{ secrets.CF_PAGES_PROJECT_WALLET_CONSOLE }}
      CF_PAGES_PROJECT_WALLET_SITE: ${{ secrets.CF_PAGES_PROJECT_WALLET_SITE }}
      CF_PAGES_PROJECT_WALLET_TESTNET: ${{ secrets.CF_PAGES_PROJECT_WALLET_TESTNET }}
      CF_PAGES_PROJECT_WALLET_MAINNET: ${{ secrets.CF_PAGES_PROJECT_WALLET_MAINNET }}
      VITE_DOCS_ORIGIN: ${{ vars.VITE_DOCS_ORIGIN }}
      VITE_TESTNET_NEAR_NETWORK: ${{ vars.VITE_TESTNET_NEAR_NETWORK }}
      VITE_TESTNET_NEAR_RPC_URL: ${{ vars.VITE_TESTNET_NEAR_RPC_URL }}
      VITE_TESTNET_NEAR_EXPLORER: ${{ vars.VITE_TESTNET_NEAR_EXPLORER }}
      VITE_TESTNET_TEMPO_RPC_URL: ${{ vars.VITE_TESTNET_TEMPO_RPC_URL }}
      VITE_TESTNET_TEMPO_EXPLORER: ${{ vars.VITE_TESTNET_TEMPO_EXPLORER }}
      VITE_TESTNET_TEMPO_FEE_TOKEN: ${{ vars.VITE_TESTNET_TEMPO_FEE_TOKEN }}
      VITE_TESTNET_ARC_RPC_URL: ${{ vars.VITE_TESTNET_ARC_RPC_URL }}
      VITE_TESTNET_ARC_EXPLORER: ${{ vars.VITE_TESTNET_ARC_EXPLORER }}
      VITE_TESTNET_WALLET_SERVICE_PATH: ${{ vars.VITE_TESTNET_WALLET_SERVICE_PATH }}
      VITE_TESTNET_SDK_BASE_PATH: ${{ vars.VITE_TESTNET_SDK_BASE_PATH }}
      VITE_TESTNET_SIGNING_SESSION_PERSISTENCE_MODE: ${{ vars.VITE_TESTNET_SIGNING_SESSION_PERSISTENCE_MODE }}
      VITE_TESTNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: ${{ vars.VITE_TESTNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID }}
      VITE_MAINNET_NEAR_NETWORK: ${{ vars.VITE_MAINNET_NEAR_NETWORK }}
      VITE_MAINNET_NEAR_RPC_URL: ${{ vars.VITE_MAINNET_NEAR_RPC_URL }}
      VITE_MAINNET_NEAR_EXPLORER: ${{ vars.VITE_MAINNET_NEAR_EXPLORER }}
      VITE_MAINNET_WALLET_SERVICE_PATH: ${{ vars.VITE_MAINNET_WALLET_SERVICE_PATH }}
      VITE_MAINNET_SDK_BASE_PATH: ${{ vars.VITE_MAINNET_SDK_BASE_PATH }}
      VITE_MAINNET_SIGNING_SESSION_PERSISTENCE_MODE: ${{ vars.VITE_MAINNET_SIGNING_SESSION_PERSISTENCE_MODE }}
      VITE_MAINNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: ${{ vars.VITE_MAINNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID }}
      VITE_DASHBOARD_WALLETS_ROUTES_ENABLED: ${{ vars.VITE_DASHBOARD_WALLETS_ROUTES_ENABLED }}
      VITE_DASHBOARD_DERIVATION_ROOT_ENABLED: ${{ vars.VITE_DASHBOARD_DERIVATION_ROOT_ENABLED }}
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend lane
        run: |
          node --input-type=module <<'JS'
          import { readBackendLane } from './scripts/deployment-targets.mjs';
          const lane = readBackendLane(process.env.DEPLOY_BACKEND_LANE);
          if (lane.site.id !== process.env.DEPLOY_SITE) {
            throw new Error('Frontend site does not match the deployment lane');
          }
          JS
      - name: Checkout public Wallet documentation
        uses: actions/checkout@v6
        with:
          repository: seams-tech/seams-wallet
          ref: main
          path: .wallet-source
          persist-credentials: false
      - name: Verify docs match the installed SDK
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const installed = JSON.parse(readFileSync('node_modules/@seams/wallet/package.json', 'utf8'));
          const source = JSON.parse(readFileSync('.wallet-source/packages/wallet/package.json', 'utf8'));
          if (source.version !== installed.version) {
            throw new Error(`Docs target SDK ${source.version}; this site uses ${installed.version}`);
          }
          const revision = execFileSync('git', ['-C', '.wallet-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_ENV, `SEAMS_WALLET_REVISION=${revision}\n`);
          JS
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build committed public Wallet docs
        run: |
          pnpm --dir .wallet-source install --frozen-lockfile
          pnpm --dir .wallet-source run build:docs
      - name: Stage committed public Wallet docs
        run: node scripts/prepare-wallet-docs-source.mjs --checkout .wallet-source --revision "$SEAMS_WALLET_REVISION" --output .artifacts/wallet-docs
      - name: Build, deploy and smoke selected frontend surfaces
        run: |
          set -euo pipefail
          for operation in build deploy smoke; do
            pnpm deploy:frontend "$operation" --site "$DEPLOY_SITE" --component "$DEPLOY_COMPONENT"
          done
      - name: Verify deployed backend and Console
        run: |
          pnpm deploy:backend smoke --lane "$DEPLOY_BACKEND_LANE" --component wallet-system
          pnpm deploy:backend smoke --lane "$DEPLOY_BACKEND_LANE" --component console
