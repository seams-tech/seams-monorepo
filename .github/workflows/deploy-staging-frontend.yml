name: Deploy / staging / frontend

on:
  workflow_call:
    inputs:
      lane:
        description: Backend lane verified after the complete frontend deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-staging-frontend
  cancel-in-progress: false

env:
  DEPLOY_SITE: staging
  DEPLOY_COMPONENT: all
  DEPLOY_BACKEND_LANE: ${{ inputs.lane }}
  DEPLOY_SHA: ${{ github.sha }}
  RUST_TOOLCHAIN: 1.96.0

jobs:
  deploy:
    name: Deploy / staging / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_VITE: ${{ secrets.CF_PAGES_PROJECT_VITE }}
      CF_PAGES_PROJECT_PLATFORM_CONSOLE: ${{ secrets.CF_PAGES_PROJECT_PLATFORM_CONSOLE }}
      CF_PAGES_PROJECT_WALLET_CONSOLE: ${{ secrets.CF_PAGES_PROJECT_WALLET_CONSOLE }}
      CF_PAGES_PROJECT_WALLET_SITE: ${{ secrets.CF_PAGES_PROJECT_WALLET_SITE }}
      CF_PAGES_PROJECT_WALLET: ${{ secrets.CF_PAGES_PROJECT_WALLET }}
      VITE_RELAYER_URL: ${{ vars.VITE_RELAYER_URL }}
      VITE_RELAYER_ACCOUNT_ID: ${{ vars.VITE_RELAYER_ACCOUNT_ID }}
      VITE_NEAR_NETWORK: ${{ vars.VITE_NEAR_NETWORK }}
      VITE_NEAR_RPC_URL: ${{ vars.VITE_NEAR_RPC_URL }}
      VITE_NEAR_EXPLORER: ${{ vars.VITE_NEAR_EXPLORER }}
      VITE_TEMPO_RPC_URL: ${{ vars.VITE_TEMPO_RPC_URL }}
      VITE_TEMPO_EXPLORER: ${{ vars.VITE_TEMPO_EXPLORER }}
      VITE_TEMPO_FEE_TOKEN: ${{ vars.VITE_TEMPO_FEE_TOKEN }}
      VITE_ARC_RPC_URL: ${{ vars.VITE_ARC_RPC_URL }}
      VITE_ARC_EXPLORER: ${{ vars.VITE_ARC_EXPLORER }}
      VITE_WALLET_ORIGIN: ${{ vars.VITE_WALLET_ORIGIN }}
      VITE_WALLET_SERVICE_PATH: ${{ vars.VITE_WALLET_SERVICE_PATH }}
      VITE_RP_ID_BASE: ${{ vars.VITE_RP_ID_BASE }}
      VITE_SDK_BASE_PATH: ${{ vars.VITE_SDK_BASE_PATH }}
      VITE_SIGNING_SESSION_PERSISTENCE_MODE: ${{ vars.VITE_SIGNING_SESSION_PERSISTENCE_MODE }}
      VITE_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: ${{ vars.VITE_ROUTER_AB_NORMAL_SIGNING_WORKER_ID }}
      VITE_DASHBOARD_WALLETS_ROUTES_ENABLED: ${{ vars.VITE_DASHBOARD_WALLETS_ROUTES_ENABLED }}
      VITE_DASHBOARD_DERIVATION_ROOT_ENABLED: ${{ vars.VITE_DASHBOARD_DERIVATION_ROOT_ENABLED }}
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require dev branch
        run: test "$GITHUB_REF" = refs/heads/dev
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve Wallet source from the installed SDK
        run: |
          node --input-type=module >> "$GITHUB_ENV" <<'JS'
          import { readFileSync } from 'node:fs';
          import { readBackendLane } from './scripts/deployment-targets.mjs';
          const lane = readBackendLane(process.env.DEPLOY_BACKEND_LANE);
          if (lane.site.id !== process.env.DEPLOY_SITE) {
            throw new Error('Frontend site does not match the deployment lane');
          }
          const wallet = JSON.parse(
            readFileSync('node_modules/@seams/wallet/package.json', 'utf8'),
          );
          const response = await fetch(
            `https://registry.npmjs.org/@seams%2Fwallet/${encodeURIComponent(wallet.version)}`,
            { signal: AbortSignal.timeout(30_000) },
          );
          if (!response.ok) {
            throw new Error(`Wallet release lookup failed: HTTP ${response.status}`);
          }
          const release = await response.json();
          if (
            release.version !== wallet.version ||
            typeof release.gitHead !== 'string' ||
            !/^[0-9a-f]{40}$/.test(release.gitHead)
          ) {
            throw new Error('The installed Wallet release has no exact source revision');
          }
          console.log(`SEAMS_WALLET_REVISION=${release.gitHead}`);
          JS
      - name: Checkout exact public Wallet source
        uses: actions/checkout@v6
        with:
          repository: seams-tech/seams-wallet
          ref: ${{ env.SEAMS_WALLET_REVISION }}
          path: .wallet-source
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build exact public Wallet docs
        run: |
          pnpm --dir .wallet-source install --frozen-lockfile
          pnpm --dir .wallet-source run build:docs
      - name: Stage exact public Wallet docs
        run: node scripts/prepare-wallet-docs-source.mjs --checkout .wallet-source --revision "$SEAMS_WALLET_REVISION" --output .artifacts/wallet-docs
      - name: Build, deploy and smoke all frontend surfaces
        run: |
          set -euo pipefail
          for operation in build deploy smoke; do
            pnpm deploy:frontend "$operation" --site "$DEPLOY_SITE" --component "$DEPLOY_COMPONENT"
          done
      - name: Verify deployed backend and Console
        run: |
          pnpm deploy:backend smoke --lane "$DEPLOY_BACKEND_LANE" --component wallet-system
          pnpm deploy:backend smoke --lane "$DEPLOY_BACKEND_LANE" --component console
