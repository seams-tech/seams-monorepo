packages:
  - tests
  - tests/intended-app
  - packages/console-shared-ts
  - packages/wallet-console-shared-ts
  - packages/wallet-console-server-ts
  - packages/console-server-ts
  - packages/grain-field-ts
  - packages/site-navbar-ts
  - voiceId
  - apps/seams-site
  - apps/wallet-console
nodeLinker: hoisted
verifyDepsBeforeRun: false
allowBuilds:
  bufferutil: true
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - '@seams/wallet-server@0.26.0'
  - '@seams/wallet@0.26.0'
  - '@seams/voiceid@0.26.0'
