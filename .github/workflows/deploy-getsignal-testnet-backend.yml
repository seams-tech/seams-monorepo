      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RELAYER_PRIVATE_KEY: ${{ secrets.GETSIGNAL_RELAYER_PRIVATE_KEY }}
      SIGNING_SESSION_SEAL_ROOT_SECRET_B64U: ${{ secrets.GETSIGNAL_SIGNING_SESSION_SEAL_ROOT_SECRET_B64U }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Gateway build entry
        run: test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
      - name: Deploy Gateway
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component gateway

  deploy_console:
    name: Deploy GetSignal Console operations
    needs: [deploy_wallet_runtime, deploy_gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-console
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONSOLE_SESSION_HMAC_SECRET: ${{ secrets.CONSOLE_SESSION_HMAC_SECRET }}
      CONSOLE_EMAIL_INVITATION_SECRET_KEY_B64U: ${{ secrets.CONSOLE_EMAIL_INVITATION_SECRET_KEY_B64U }}
      CONSOLE_WEBHOOK_SECRET_KEY_B64U: ${{ secrets.CONSOLE_WEBHOOK_SECRET_KEY_B64U }}
      STRIPE_API_SK: ${{ secrets.STRIPE_API_SK }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TENANT_ROOT_GRANT_AUTHORITY_SIGNING_KEY_ID: ${{ secrets.TENANT_ROOT_GRANT_AUTHORITY_SIGNING_KEY_ID }}
      TENANT_ROOT_GRANT_AUTHORITY_SIGNING_SEED: ${{ secrets.TENANT_ROOT_GRANT_AUTHORITY_SIGNING_SEED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.SEAMS_GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.SEAMS_GITHUB_OAUTH_CLIENT_SECRET }}
      GITHUB_OAUTH_CALLBACK_URL: ${{ secrets.SEAMS_GITHUB_OAUTH_CALLBACK_URL }}
      SATYR_DEPLOYMENT_ID: ${{ secrets.SATYR_DEPLOYMENT_ID }}
      SATYR_ACCOUNT_ASSERTION_ISSUER: ${{ secrets.SATYR_ACCOUNT_ASSERTION_ISSUER }}
      SATYR_ACCOUNT_ASSERTION_AUDIENCE: ${{ secrets.SATYR_ACCOUNT_ASSERTION_AUDIENCE }}
      SATYR_ACCOUNT_USER_ASSERTION_KEY_ID: ${{ secrets.SATYR_ACCOUNT_USER_ASSERTION_KEY_ID }}
      SATYR_ACCOUNT_USER_ASSERTION_PUBLIC_JWK_JSON: ${{ secrets.SATYR_ACCOUNT_USER_ASSERTION_PUBLIC_JWK_JSON }}
      SATYR_GOOGLE_OIDC_CLIENT_ID: ${{ secrets.SATYR_GOOGLE_OIDC_CLIENT_ID }}
      SATYR_SERVICE_ORIGIN: ${{ secrets.SATYR_SERVICE_ORIGIN }}
      SATYR_PROVISION_PLACEMENT_CELL_ID: ${{ secrets.SATYR_PROVISION_PLACEMENT_CELL_ID }}
      SATYR_PROVISION_ENVIRONMENT: ${{ secrets.SATYR_PROVISION_ENVIRONMENT }}
