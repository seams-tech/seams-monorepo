      ACCOUNT_PROVISION_ASSERTION_ISSUER: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_ISSUER }}
      ACCOUNT_PROVISION_ASSERTION_AUDIENCE: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_AUDIENCE }}
      ACCOUNT_PROVISION_ASSERTION_KEY_ID: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_KEY_ID }}
      ACCOUNT_PROVISION_ASSERTION_PRIVATE_JWK_JSON: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_PRIVATE_JWK_JSON }}
      SEAMS_TENANT_BOOTSTRAP_PUBLISHABLE_KEY: ${{ vars.GETSIGNAL_TENANT_BOOTSTRAP_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout exact runtime revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore exact Console artifact
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Deploy GetSignal operations with the existing account authority
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component console

  cleanup_build_cache:
    name: Cleanup / getsignal-testnet / backend build cache
    if: always()
    needs:
      - migrate
      - deploy_console
      - deploy_signing_worker
      - deploy_deriver_a
      - deploy_deriver_b
      - deploy_tenant_root_control_plane
      - deploy_router
      - deploy_wallet_runtime
      - deploy_gateway
    runs-on: ubuntu-latest
    steps:
      - name: Delete ephemeral backend build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$BACKEND_BUILD_CACHE_KEY" --repo "$GITHUB_REPOSITORY"
