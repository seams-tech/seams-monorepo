[package]
name = "tx-grammar-infer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Refactor 210 Gate STT-1: Aurora and Citrinet with tract on the transaction grammar"

# Standalone: not a member of any parent workspace.
[workspace]

[[bin]]
name = "txg-infer"
path = "src/main.rs"

[dependencies]
tract-onnx = "=0.23.10"
anyhow = "1"
serde_json = "1"

[profile.release]
opt-level = 3
