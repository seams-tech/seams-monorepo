name: Deploy / production-testnet / backend

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deployment-production-testnet-backend
  cancel-in-progress: false

env:
  BACKEND_BUILD_CACHE_KEY: backend-build-production-testnet-${{ github.run_id }}-${{ github.run_attempt }}
  DEPLOY_LANE: production-testnet
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build / production-testnet / backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build backend artifact
        run: pnpm deploy:backend build --lane "$DEPLOY_LANE" --component wallet-system
      - name: Check fixed build entries
        run: |
          set -euo pipefail
          for component in signing-worker deriver-a deriver-b router tenant-root-control-plane; do
            test -s ".release-artifacts/router-ab-runtime/build/$component/worker/shim.mjs"
          done
          test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
          test -s .release-artifacts/wallet-runtime/payload/d1WalletRuntimeWorker.js
      - name: Save backend build
        uses: actions/cache/save@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts

  migrate:
    name: Migrate / production-testnet / gateway
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-testnet-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Gateway build entry
        run: test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
      - name: Apply D1 migrations
        run: pnpm deploy:backend migrate --lane "$DEPLOY_LANE" --component wallet-system

  deploy_signing_worker:
    name: Deploy / production-testnet / signing-worker
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-signing-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PRIVATE_KEY: ${{ secrets.SIGNING_WORKER_SERVER_OUTPUT_HPKE_PRIVATE_KEY }}
      SIGNING_WORKER_PRIVATE_D1_KEK: ${{ secrets.SIGNING_WORKER_PRIVATE_D1_KEK }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_PRIVATE_D1_ID: ${{ vars.ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_ID }}
      SIGNING_WORKER_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_KEK_PUBLIC_KEY }}
      SIGNING_WORKER_PRIVATE_D1_KEK_VERSION: ${{ vars.ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_KEK_VERSION }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Signing Worker build entry
        run: test -s .release-artifacts/router-ab-runtime/build/signing-worker/worker/shim.mjs
      - name: Deploy Signing Worker
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component signing-worker

  deploy_deriver_a:
    name: Deploy / production-testnet / deriver-a
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-deriver-a
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY }}
      DERIVER_A_PEER_SIGNING_KEY: ${{ secrets.DERIVER_A_PEER_SIGNING_KEY }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK: ${{ secrets.DERIVER_A_ROLE_PRIVATE_D1_KEK }}
      DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY }}
      DERIVER_A_PRIVATE_D1_ID: ${{ vars.ROUTER_AB_DERIVER_A_PRIVATE_D1_ID }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK_VERSION: ${{ vars.ROUTER_AB_DERIVER_A_ROLE_PRIVATE_D1_KEK_VERSION }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_PEER_VERIFYING_KEY_HEX }}
      DERIVER_A_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF }}
      DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY: ${{ secrets.DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Deriver A build entry
        run: test -s .release-artifacts/router-ab-runtime/build/deriver-a/worker/shim.mjs
      - name: Deploy Deriver A
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component deriver-a

  deploy_deriver_b:
    name: Deploy / production-testnet / deriver-b
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-deriver-b
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      DERIVER_B_ENVELOPE_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_B_ENVELOPE_HPKE_PRIVATE_KEY }}
      DERIVER_B_PEER_SIGNING_KEY: ${{ secrets.DERIVER_B_PEER_SIGNING_KEY }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK: ${{ secrets.DERIVER_B_ROLE_PRIVATE_D1_KEK }}
      DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY: ${{ secrets.DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY }}
      DERIVER_B_PRIVATE_D1_ID: ${{ vars.ROUTER_AB_DERIVER_B_PRIVATE_D1_ID }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK_VERSION: ${{ vars.ROUTER_AB_DERIVER_B_ROLE_PRIVATE_D1_KEK_VERSION }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF }}
      DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY: ${{ secrets.DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Deriver B build entry
        run: test -s .release-artifacts/router-ab-runtime/build/deriver-b/worker/shim.mjs
      - name: Deploy Deriver B
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component deriver-b

  deploy_tenant_root_control_plane:
    name: Deploy / production-testnet / tenant-root-control-plane
    needs: [deploy_signing_worker, deploy_deriver_a, deploy_deriver_b]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-tenant-root-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY: ${{ secrets.TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY_ID: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY_ID }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      OPERATIONS_INCIDENT_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_OPERATIONS_INCIDENT_VERIFYING_KEY_HEX }}
      DERIVER_A_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX }}
      DERIVER_B_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.ROUTER_AB_DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.ROUTER_AB_DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check control-plane build entry
        run: test -s .release-artifacts/router-ab-runtime/build/tenant-root-control-plane/worker/shim.mjs
      - name: Deploy tenant-root control plane
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component tenant-root-control-plane

  deploy_router:
    name: Deploy / production-testnet / router
    needs: deploy_tenant_root_control_plane
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-mpc-router
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      ROUTER_AB_JWT_ISSUER: ${{ vars.ROUTER_AB_JWT_ISSUER }}
      ROUTER_AB_JWT_AUDIENCE: ${{ vars.ROUTER_AB_JWT_AUDIENCE }}
      ROUTER_AB_JWT_JWKS_JSON: ${{ vars.ROUTER_AB_JWT_JWKS_JSON }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
      DERIVER_A_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_PEER_VERIFYING_KEY_HEX }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Router build entry
        run: test -s .release-artifacts/router-ab-runtime/build/router/worker/shim.mjs
      - name: Deploy Router
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component router

  deploy_wallet_runtime:
    name: Deploy / production-testnet / wallet-runtime
    needs: [deploy_router, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID_DERIVATION_SECRET: ${{ secrets.ACCOUNT_ID_DERIVATION_SECRET }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET: ${{ secrets.LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET }}
      ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK: ${{ secrets.ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
      SIGNING_SESSION_SEAL_ROOT_SECRET_B64U: ${{ secrets.SIGNING_SESSION_SEAL_ROOT_SECRET_B64U }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_PEER_VERIFYING_KEY_HEX }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Wallet Runtime build entry
        run: test -s .release-artifacts/wallet-runtime/payload/d1WalletRuntimeWorker.js
      - name: Deploy Wallet Runtime
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component wallet-runtime

  deploy_gateway:
    name: Deploy / production-testnet / gateway
    needs: [deploy_router, deploy_wallet_runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-testnet-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID_DERIVATION_SECRET: ${{ secrets.ACCOUNT_ID_DERIVATION_SECRET }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET: ${{ secrets.LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET }}
      ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK: ${{ secrets.ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
      SIGNING_SESSION_SEAL_ROOT_SECRET_B64U: ${{ secrets.SIGNING_SESSION_SEAL_ROOT_SECRET_B64U }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_A_PEER_VERIFYING_KEY_HEX }}
      DERIVER_B_PEER_VERIFYING_KEY_HEX: ${{ vars.ROUTER_AB_DERIVER_B_PEER_VERIFYING_KEY_HEX }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Gateway build entry
        run: test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
      - name: Deploy Gateway
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component gateway
      - name: Run backend smoke tests
        run: pnpm deploy:backend smoke --lane "$DEPLOY_LANE" --component wallet-system

  cleanup_build_cache:
    name: Cleanup / production-testnet / backend build cache
    if: always()
    needs:
      - migrate
      - deploy_signing_worker
      - deploy_deriver_a
      - deploy_deriver_b
      - deploy_tenant_root_control_plane
      - deploy_router
      - deploy_wallet_runtime
      - deploy_gateway
    runs-on: ubuntu-latest
    steps:
      - name: Delete ephemeral backend build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$BACKEND_BUILD_CACHE_KEY" --repo "$GITHUB_REPOSITORY"
