name: Deploy / Console backend

on:
  workflow_call:
    inputs:
      lane:
        description: Console deployment lane
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: Console deployment lane
        required: true
        type: choice
        options:
          - staging-testnet
          - production-testnet
          - production-mainnet

permissions:
  actions: write
  contents: read

concurrency:
  group: deployment-console-${{ inputs.lane }}
  cancel-in-progress: false

env:
  CONSOLE_BUILD_CACHE_KEY: console-build-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
  DEPLOY_LANE: ${{ inputs.lane }}
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  configure:
    name: Configure / Console / ${{ inputs.lane }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        name: Resolve deployment environment
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$DEPLOY_LANE" in
            staging-testnet)
              test "$REF_NAME" = dev
              echo "environment=staging-console" >> "$GITHUB_OUTPUT"
              ;;
            production-testnet)
              test "$REF_NAME" = main
              echo "environment=production-testnet-console" >> "$GITHUB_OUTPUT"
              ;;
            production-mainnet)
              test "$REF_NAME" = main
              echo "environment=production-console" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build / Console / ${{ inputs.lane }}
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build backend artifact
        run: pnpm deploy:backend build --lane "$DEPLOY_LANE" --component console
      - name: Check Console build entry
        run: test -s .release-artifacts/console/payload/d1ConsoleStagingWorker.js
      - name: Save Console build
        uses: actions/cache/save@v6
        with:
          key: ${{ env.CONSOLE_BUILD_CACHE_KEY }}
          path: |
            .release-artifacts/console
            packages/console-server-ts/.wrangler/generated

  migrate:
    name: Migrate / Console / ${{ inputs.lane }}
    needs: [configure, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.configure.outputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore Console build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.CONSOLE_BUILD_CACHE_KEY }}
          path: |
            .release-artifacts/console
            packages/console-server-ts/.wrangler/generated
          fail-on-cache-miss: true
      - name: Apply Console D1 migrations
        run: pnpm deploy:backend migrate --lane "$DEPLOY_LANE" --component console

  deploy:
    name: Deploy / Console / ${{ inputs.lane }}
    needs: [configure, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ needs.configure.outputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONSOLE_SESSION_HMAC_SECRET: ${{ secrets.CONSOLE_SESSION_HMAC_SECRET }}
      CONSOLE_EMAIL_INVITATION_SECRET_KEY_B64U: ${{ secrets.CONSOLE_EMAIL_INVITATION_SECRET_KEY_B64U }}
      CONSOLE_WEBHOOK_SECRET_KEY_B64U: ${{ secrets.CONSOLE_WEBHOOK_SECRET_KEY_B64U }}
      STRIPE_API_SK: ${{ secrets.STRIPE_API_SK }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TENANT_ROOT_GRANT_AUTHORITY_SIGNING_KEY_ID: ${{ secrets.TENANT_ROOT_GRANT_AUTHORITY_SIGNING_KEY_ID }}
      TENANT_ROOT_GRANT_AUTHORITY_SIGNING_SEED: ${{ secrets.TENANT_ROOT_GRANT_AUTHORITY_SIGNING_SEED }}
      TENANT_ROOT_RECOVERY_CERTIFICATES_JSON: ${{ vars.TENANT_ROOT_RECOVERY_CERTIFICATES_JSON }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.SEAMS_GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.SEAMS_GITHUB_OAUTH_CLIENT_SECRET }}
      GITHUB_OAUTH_CALLBACK_URL: ${{ secrets.SEAMS_GITHUB_OAUTH_CALLBACK_URL }}
      SATYR_DEPLOYMENT_ID: ${{ secrets.SATYR_DEPLOYMENT_ID }}
      SATYR_ACCOUNT_ASSERTION_ISSUER: ${{ secrets.SATYR_ACCOUNT_ASSERTION_ISSUER }}
      SATYR_ACCOUNT_ASSERTION_AUDIENCE: ${{ secrets.SATYR_ACCOUNT_ASSERTION_AUDIENCE }}
      SATYR_ACCOUNT_USER_ASSERTION_KEY_ID: ${{ secrets.SATYR_ACCOUNT_USER_ASSERTION_KEY_ID }}
      SATYR_ACCOUNT_USER_ASSERTION_PUBLIC_JWK_JSON: ${{ secrets.SATYR_ACCOUNT_USER_ASSERTION_PUBLIC_JWK_JSON }}
      SATYR_GOOGLE_OIDC_CLIENT_ID: ${{ secrets.SATYR_GOOGLE_OIDC_CLIENT_ID }}
      SATYR_SERVICE_ORIGIN: ${{ secrets.SATYR_SERVICE_ORIGIN }}
      SATYR_PROVISION_PLACEMENT_CELL_ID: ${{ secrets.SATYR_PROVISION_PLACEMENT_CELL_ID }}
      SATYR_PROVISION_ENVIRONMENT: ${{ secrets.SATYR_PROVISION_ENVIRONMENT }}
      SATYR_PROVISION_TOKEN: ${{ secrets.SATYR_PROVISION_TOKEN }}
      ACCOUNT_PROVISION_ASSERTION_ISSUER: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_ISSUER }}
      ACCOUNT_PROVISION_ASSERTION_AUDIENCE: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_AUDIENCE }}
      ACCOUNT_PROVISION_ASSERTION_KEY_ID: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_KEY_ID }}
      ACCOUNT_PROVISION_ASSERTION_PRIVATE_JWK_JSON: ${{ secrets.ACCOUNT_PROVISION_ASSERTION_PRIVATE_JWK_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore Console build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.CONSOLE_BUILD_CACHE_KEY }}
          path: |
            .release-artifacts/console
            packages/console-server-ts/.wrangler/generated
          fail-on-cache-miss: true
      - name: Deploy Console
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component console
      - name: Smoke Console
        run: pnpm deploy:backend smoke --lane "$DEPLOY_LANE" --component console

  cleanup_build_cache:
    name: Cleanup / Console / ${{ inputs.lane }}
    if: always() && needs.build.result == 'success'
    needs: [build, migrate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Delete ephemeral Console build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$CONSOLE_BUILD_CACHE_KEY" --repo "$GITHUB_REPOSITORY"
