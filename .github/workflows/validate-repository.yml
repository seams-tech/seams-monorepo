name: Validate / repository

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check private applications and deployment composition
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint, types, and architecture
        run: pnpm check

      - name: Build private applications
        run: pnpm build

      - name: Install account acceptance browser
        run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Shared account acceptance
        run: pnpm -C tests exec playwright test -c playwright.config.ts 'e2e/console/shared-account-.*\.e2e\.test\.ts' e2e/console/shared-wallet-settlement.e2e.test.ts --reporter=line

      - name: Save account browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-evidence-${{ github.sha }}
          path: |
            tests/test-results/**/automatic-wallet-setup/*.png
            tests/test-results/**/automatic-wallet-setup/*.json
            tests/test-results/**/automatic-wallet-setup/trace.zip
            tests/test-results/**/error-context.md
          if-no-files-found: ignore

      - name: Build native service acceptance authority
        run: pnpm -C tests exec node helpers/buildSharedAccountPlatformWorker.mjs

      - name: Publish native service acceptance authority
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shared-account-authority-${{ github.sha }}
          path: .artifacts/shared-account-platform/account-worker/index.mjs
          if-no-files-found: error
