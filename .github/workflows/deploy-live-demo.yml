name: Deploy / production-testnet / full stack
run-name: deploy / production-testnet / full stack / ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: deployment-production-live-demo
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production revision
    runs-on: ubuntu-latest
    outputs:
      environment_id: ${{ steps.target.outputs.environment_id }}
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve configured testnet environment
        id: target
        run: |
          node --input-type=module >> "$GITHUB_OUTPUT" <<'JS'
          import { readBackendLane } from './scripts/deployment-targets.mjs';
          const lane = readBackendLane('production-testnet');
          if (lane.provisioning.kind !== 'provisioned') {
            throw new Error('Production testnet must have a provisioned deployment config');
          }
          console.log(`environment_id=${lane.provisioning.gatewayDeploymentConfig.tenant.environmentId}`);
          JS
      - name: Require packaged resource challenge migration
        run: test -s node_modules/@seams/wallet-server/migrations/d1-signer/0042_deployment_resource_challenges.sql

  authorize:
    name: Authorize production live-demo deployment
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production-live-demo
    steps:
      - run: echo "Production live-demo deployment authorized"

  # The Console binds every regional Gateway and Wallet Runtime, so it
  # deploys after the backend has created them.
  deploy_console:
    name: Deploy Console control plane
    needs: [authorize, deploy_wallet_system]
    uses: ./.github/workflows/deploy-console-backend.yml
    with:
      lane: production-testnet
    secrets: inherit

  deploy_wallet_system:
    name: Deploy live-demo runtime surfaces
    needs: authorize
    uses: ./.github/workflows/deploy-production-testnet-backend.yml
    secrets: inherit

  cutover:
    name: Activate live-demo tenant binding
    needs: [validate, deploy_console, deploy_wallet_system]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-live-demo
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Coordinate and verify cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT_ID: ${{ needs.validate.outputs.environment_id }}
        run: >-
          pnpm tenant:cutover
          --lane production-testnet
          --environment-id "$ENVIRONMENT_ID"
      - name: Smoke activated Wallet runtime
        run: pnpm deploy:backend smoke --lane production-testnet --component wallet-system
      - name: Smoke activated Console
        run: pnpm deploy:backend smoke --lane production-testnet --component console

  deploy_frontend:
    name: Deploy / production-testnet / frontend
    needs: cutover
    uses: ./.github/workflows/deploy-production-frontend.yml
    with:
      lane: production-testnet
    secrets: inherit
