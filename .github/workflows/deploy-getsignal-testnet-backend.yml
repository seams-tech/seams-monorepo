name: Deploy / getsignal-testnet / backend

on:
  workflow_call:

permissions:
  actions: write
  contents: read

concurrency:
  group: deployment-getsignal-testnet-backend
  cancel-in-progress: false

env:
  BACKEND_BUILD_CACHE_KEY: backend-build-getsignal-testnet-${{ github.run_id }}-${{ github.run_attempt }}
  DEPLOY_LANE: getsignal-testnet
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build / getsignal-testnet / backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build backend artifact
        run: pnpm deploy:backend build --lane "$DEPLOY_LANE" --component wallet-system
      - name: Build Console operations artifact
        run: pnpm deploy:backend build --lane "$DEPLOY_LANE" --component console
      - name: Check fixed build entries
        run: |
          set -euo pipefail
          for component in signing-worker deriver-a deriver-b router tenant-root-control-plane; do
            test -s ".release-artifacts/router-ab-runtime/build/$component/worker/shim.mjs"
          done
          test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
          test -s .release-artifacts/wallet-runtime/payload/d1WalletRuntimeWorker.js
      - name: Save backend build
        uses: actions/cache/save@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts

  bootstrap:
    name: Bootstrap isolated GetSignal services and Router namespaces
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-live-demo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact build revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore exact runtime artifact
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Bootstrap missing GetSignal resources
        run: pnpm deploy:backend bootstrap --lane "$DEPLOY_LANE" --component wallet-system

  migrate:
    name: Migrate / getsignal-testnet / gateway
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAYER_PRIVATE_KEY: ${{ secrets.GETSIGNAL_RELAYER_PRIVATE_KEY }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter @seams-internal/console-server... --filter @seams-internal/wallet-console-server...
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Gateway build entry
        run: test -s .release-artifacts/gateway/payload/d1GatewayWorker.js
      - name: Apply D1 migrations
        run: pnpm deploy:backend migrate --lane "$DEPLOY_LANE" --component wallet-system

  deploy_signing_worker:
    name: Deploy / getsignal-testnet / signing-worker
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-signing-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      ROUTER_AB_ROUTER_TO_SIGNING_WORKER_ECDSA_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_ROUTER_TO_SIGNING_WORKER_ECDSA_AUTH_SECRET }}
      ROUTER_AB_GATEWAY_TO_SIGNING_WORKER_PRESIGN_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_GATEWAY_TO_SIGNING_WORKER_PRESIGN_AUTH_SECRET }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PRIVATE_KEY }}
      SIGNING_WORKER_PRIVATE_D1_KEK: ${{ secrets.GETSIGNAL_SIGNING_WORKER_PRIVATE_D1_KEK }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_PRIVATE_D1_ID: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_ID }}
      SIGNING_WORKER_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_KEK_PUBLIC_KEY }}
      SIGNING_WORKER_PRIVATE_D1_KEK_VERSION: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_PRIVATE_D1_KEK_VERSION }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Signing Worker build entry
        run: test -s .release-artifacts/router-ab-runtime/build/signing-worker/worker/shim.mjs
      - name: Deploy Signing Worker
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component signing-worker

  deploy_deriver_a:
    name: Deploy / getsignal-testnet / deriver-a
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-deriver-a
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_A_ENVELOPE_HPKE_PRIVATE_KEY }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK: ${{ secrets.GETSIGNAL_DERIVER_A_ROLE_PRIVATE_D1_KEK }}
      DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY }}
      DERIVER_A_PRIVATE_D1_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_PRIVATE_D1_ID }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY }}
      DERIVER_A_ROLE_PRIVATE_D1_KEK_VERSION: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ROLE_PRIVATE_D1_KEK_VERSION }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF }}
      DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION }}
      DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY: ${{ secrets.GETSIGNAL_DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Deriver A build entry
        run: test -s .release-artifacts/router-ab-runtime/build/deriver-a/worker/shim.mjs
      - name: Deploy Deriver A
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component deriver-a

  deploy_deriver_b:
    name: Deploy / getsignal-testnet / deriver-b
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-deriver-b
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      DERIVER_B_ENVELOPE_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_B_ENVELOPE_HPKE_PRIVATE_KEY }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK: ${{ secrets.GETSIGNAL_DERIVER_B_ROLE_PRIVATE_D1_KEK }}
      DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PRIVATE_KEY }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY: ${{ secrets.GETSIGNAL_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PRIVATE_KEY }}
      DERIVER_B_PRIVATE_D1_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_PRIVATE_D1_ID }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ROLE_PRIVATE_D1_KEK_PUBLIC_KEY }}
      DERIVER_B_ROLE_PRIVATE_D1_KEK_VERSION: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ROLE_PRIVATE_D1_KEK_VERSION }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_ONLINE_EPOCH_WRAPPING_KEY_REF }}
      DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_ONLINE_HPKE_PUBLIC_KEY }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_PROVIDER_ID }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_KEY_VERSION }}
      DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_MANAGED_BACKUP_HPKE_PUBLIC_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY: ${{ secrets.GETSIGNAL_DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Deriver B build entry
        run: test -s .release-artifacts/router-ab-runtime/build/deriver-b/worker/shim.mjs
      - name: Deploy Deriver B
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component deriver-b

  deploy_tenant_root_control_plane:
    name: Deploy / getsignal-testnet / tenant-root-control-plane
    needs: [deploy_signing_worker, deploy_deriver_a, deploy_deriver_b]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-tenant-root-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY: ${{ secrets.GETSIGNAL_TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY_ID: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_SIGNING_KEY_ID }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      OPERATIONS_INCIDENT_VERIFYING_KEY_HEX: ${{ vars.GETSIGNAL_ROUTER_AB_OPERATIONS_INCIDENT_VERIFYING_KEY_HEX }}
      DERIVER_A_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX }}
      DERIVER_B_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_CUSTODY_AUTHORITY_VERIFYING_KEY_HEX }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_TENANT_ROOT_CREATION_SIGNING_KEY_ID }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check control-plane build entry
        run: test -s .release-artifacts/router-ab-runtime/build/tenant-root-control-plane/worker/shim.mjs
      - name: Deploy tenant-root control plane
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component tenant-root-control-plane

  deploy_router:
    name: Deploy / getsignal-testnet / router
    needs: deploy_tenant_root_control_plane
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-mpc-router
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      ROUTER_AB_ROUTER_TO_SIGNING_WORKER_ECDSA_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_ROUTER_TO_SIGNING_WORKER_ECDSA_AUTH_SECRET }}
      ROUTER_AB_GATEWAY_TO_ROUTER_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_GATEWAY_TO_ROUTER_AUTH_SECRET }}
      ROUTER_AB_JWT_ISSUER: ${{ vars.GETSIGNAL_ROUTER_AB_JWT_ISSUER }}
      ROUTER_AB_JWT_AUDIENCE: ${{ vars.GETSIGNAL_ROUTER_AB_JWT_AUDIENCE }}
      ROUTER_AB_JWT_JWKS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_JWT_JWKS_JSON }}
      DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_A_ENVELOPE_HPKE_PUBLIC_KEY }}
      DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_DERIVER_B_ENVELOPE_HPKE_PUBLIC_KEY }}
      SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY: ${{ vars.GETSIGNAL_ROUTER_AB_SIGNING_WORKER_SERVER_OUTPUT_HPKE_PUBLIC_KEY }}
      TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_ISSUER_VERIFYING_KEYS_JSON }}
      TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CONTROL_PLANE_GRANT_AUTHORITY_VERIFYING_KEYS_JSON }}
      ROUTER_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON: ${{ vars.GETSIGNAL_ROUTER_AB_TENANT_ROOT_CREATION_ROLE_VERIFYING_KEYS_JSON }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backend build
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.BACKEND_BUILD_CACHE_KEY }}
          path: .release-artifacts
          fail-on-cache-miss: true
      - name: Check Router build entry
        run: test -s .release-artifacts/router-ab-runtime/build/router/worker/shim.mjs
      - name: Deploy Router
        run: pnpm deploy:backend deploy --lane "$DEPLOY_LANE" --component router

  deploy_wallet_runtime:
    name: Deploy / getsignal-testnet / wallet-runtime
    needs: [deploy_router, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_INTERNAL_SERVICE_AUTH_SECRET }}
      ROUTER_AB_GATEWAY_TO_ROUTER_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_GATEWAY_TO_ROUTER_AUTH_SECRET }}
      ROUTER_AB_GATEWAY_TO_SIGNING_WORKER_PRESIGN_AUTH_SECRET: ${{ secrets.GETSIGNAL_ROUTER_AB_GATEWAY_TO_SIGNING_WORKER_PRESIGN_AUTH_SECRET }}
      LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET: ${{ secrets.GETSIGNAL_LINKED_DEVICE_TARGET_DESCRIPTOR_HMAC_SECRET }}
      ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK: ${{ secrets.GETSIGNAL_ROUTER_AB_CEREMONY_JWT_PRIVATE_JWK }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RELAYER_PRIVATE_KEY: ${{ secrets.GETSIGNAL_RELAYER_PRIVATE_KEY }}
      SIGNING_SESSION_SEAL_ROOT_SECRET_B64U: ${{ secrets.GETSIGNAL_SIGNING_SESSION_SEAL_ROOT_SECRET_B64U }}
